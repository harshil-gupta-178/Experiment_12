version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mern_mongo_local
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mern_deploy_db
    volumes:
      - mongo-data:/data/db

  mern-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mern_fullstack_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/mern_deploy_db
    depends_on:
      - mongodb

volumes:
  mongo-data:
